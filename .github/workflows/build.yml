name: Build & Deploy HPE Recipe Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build & Test Backend
        working-directory: go-backend
        run: |
          go test -v ./...
          go build -v ./cmd/recipe-api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Docker Image
        run: docker build -t hpe-recipe-detection:${{ github.sha }} .

      - name: Upload Backend Binary
        uses: actions/upload-artifact@v4
        with:
          name: recipe-api-binary
          path: go-backend/recipe-api
